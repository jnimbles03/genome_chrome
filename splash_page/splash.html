<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Form Genome Project - We've Moved</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Deep, animated background matching the extension theme */
            background: linear-gradient(135deg, #1e1e24 0%, #2a2a35 50%, #1e1e24 100%);
            background-size: 200% 200%;
            animation: gradientBG 20s ease infinite;
            color: white;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }

        .glass-panel {
            background: rgba(42, 42, 53, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
        }

        .btn-cta {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            text-decoration: none;
            padding: 18px 36px;
            border-radius: 99px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(79, 70, 229, 0.6);
            background: linear-gradient(135deg, #595cdb 0%, #4338ca 100%);
        }

        .btn-cta:active {
            transform: translateY(0);
        }

        .logo {
            font-size: 64px;
            margin-bottom: 30px;
            display: inline-block;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="glass-panel">
            <div class="logo">🧬</div>
            <h1>The Form Genome Project</h1>
            <p>We've evolved. To provide a deeper, more integrated analysis experience, we have moved to a browser-first
                architecture.</p>

            <a href="https://drive.google.com/drive/folders/1sL_2tJ_2a3b4c5d6e7f8g9h0i" class="btn-cta" target="_blank">
                Get the Chrome Extension
            </a>

            <div class="footer">
                &copy; 2026 The Form Genome Project
            </div>
        </div>
    </div>
</body>

</html>
